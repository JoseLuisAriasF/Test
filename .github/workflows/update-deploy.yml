name: Update data

# Refreshes games/codes/badges/guides every 2 hours and commits them.
# Publishing is done by Cloudflare Workers Builds, which is connected to this repo
# and deploys every push to main (no API token stored here).
on:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  models: read # free AI guides via GitHub Models

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

      - name: Refresh games, codes, badges, guides
        if: github.event_name != 'push'
        run: |
          cp src/data/games.json "$RUNNER_TEMP/games.prev.json"
          npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Real World 360° places (weekly, skips when fresh)
        if: github.event_name != 'push'
        run: node scripts/realworld.mjs

      - name: Commit data (Cloudflare deploys it)
        if: github.event_name != 'push'
        run: |
          git config user.name "bibibox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/games.json src/data/realworld.json
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%FT%H:%MZ)" && git push)

      - name: Ping IndexNow (Bing, Yandex, DuckDuckGo) once Cloudflare has deployed
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          sleep 240
          node scripts/indexnow.mjs "$RUNNER_TEMP/games.prev.json"
